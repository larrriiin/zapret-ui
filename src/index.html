<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ZAPRET UI</title>

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        .glass-panel {
            background: color-mix(in srgb, var(--color-primary) 5%, transparent);
            backdrop-filter: blur(40px);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--color-surface-container-highest); border-radius: 10px; }

        /* Titlebar */
        #titlebar {
            height: 30px;
            user-select: none;
            -webkit-user-select: none;
        }
        #titlebar [data-tauri-drag-region] { cursor: move; cursor: grab; }
        #titlebar [data-tauri-drag-region]:active { cursor: grabbing; }

        .restart-banner {
            position: fixed;
            bottom: 1.5rem;
            left: 5.5rem;
            right: 1.5rem;
            background: color-mix(in srgb, var(--color-popup) 70%, transparent);
            backdrop-filter: blur(20px);
            border: 1px solid color-mix(in srgb, var(--color-primary) 25%, transparent);
            border-radius: 1.5rem;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 9999;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .titlebar-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 30px;
            transition: background 0.15s;
            cursor: pointer;
        }
        .titlebar-btn:hover { background: color-mix(in srgb, var(--color-primary) 12%, transparent); }
        .titlebar-btn.close:hover { background: color-mix(in srgb, var(--color-error-dim) 70%, transparent); }
        .titlebar-btn .material-symbols-outlined { font-size: 15px; }

        /* Active filter card */
        .card-active {
            border-color: color-mix(in srgb, var(--color-primary) 60%, transparent) !important;
            box-shadow: 0 0 16px color-mix(in srgb, var(--color-primary) 20%, transparent);
        }

        /* Disabled filter card */
        .card-disabled { cursor: not-allowed !important; }

        .toggle-btn { transition: background 0.2s; }
        .toggle-btn.is-on { background: color-mix(in srgb, var(--color-primary) 20%, transparent); }
        .toggle-btn.is-off { background: color-mix(in srgb, var(--color-outline-variant) 30%, transparent); }
        .toggle-thumb { transition: transform 0.2s; }
        .toggle-btn.is-on .toggle-thumb { transform: translateX(24px); }
        .toggle-btn.is-off .toggle-thumb { transform: translateX(0px); }

        .nav-active {
            background: color-mix(in srgb, var(--color-primary) 14%, transparent) !important;
            color: var(--color-primary) !important;
        }
        .nav-inactive {
            color: color-mix(in srgb, var(--color-on-surface) 35%, transparent) !important;
        }
        .nav-inactive:hover {
            color: color-mix(in srgb, var(--color-primary) 75%, transparent) !important;
            background: color-mix(in srgb, var(--color-primary) 7%, transparent) !important;
        }
        #nav-indicator {
            position: absolute;
            left: 0;
            width: 3px;
            border-radius: 0 3px 3px 0;
            background: var(--color-primary);
            box-shadow: 0 0 8px color-mix(in srgb, var(--color-primary) 60%, transparent);
            transition: top 0.25s cubic-bezier(0.4,0,0.2,1), height 0.25s cubic-bezier(0.4,0,0.2,1), opacity 0.2s;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes secFadeOut {
            from { opacity: 1; transform: translateY(0px); }
            to   { opacity: 0; transform: translateY(6px); }
        }
        @keyframes secFadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0px); }
        }
        .section-exit {
            animation: secFadeOut 0.12s ease forwards;
            pointer-events: none;
        }
        .section-enter {
            animation: secFadeIn 0.16s ease forwards;
        }

        /* Neon Lamp Divider styles */
        .status-lamp {
            width: 96px;
            height: 4px;
            border-radius: 99px;
            margin: 0 auto 20px auto;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }
        
        .status-lamp.is-off {
            background: color-mix(in srgb, var(--color-on-surface) 8%, transparent) !important;
            box-shadow: 0 0 0px transparent !important;
            opacity: 0.35 !important;
            transition: background 1.5s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 1.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.5s ease !important;
        }

        .status-lamp.is-on {
            opacity: 1 !important;
            animation: neon-spark 0.6s ease-out forwards, neon-glow 28s infinite 0.6s;
            transition: none !important;
        }

        @keyframes neon-spark {
            0% { opacity: 0.1; background: color-mix(in srgb, var(--color-on-surface) 8%, transparent); box-shadow: none; }
            10% { opacity: 0.8; background: linear-gradient(90deg, transparent, var(--color-primary), transparent); box-shadow: 0 0 15px color-mix(in srgb, var(--color-primary) 60%, transparent); }
            15% { opacity: 0.2; background: color-mix(in srgb, var(--color-on-surface) 8%, transparent); box-shadow: none; }
            25% { opacity: 0.9; background: linear-gradient(90deg, transparent, var(--color-secondary), transparent); box-shadow: 0 0 25px color-mix(in srgb, var(--color-secondary) 70%, transparent); }
            30% { opacity: 0.3; background: color-mix(in srgb, var(--color-on-surface) 8%, transparent); box-shadow: none; }
            45% { opacity: 0.7; background: linear-gradient(90deg, transparent, var(--color-primary), transparent); box-shadow: 0 0 15px color-mix(in srgb, var(--color-primary) 50%, transparent); }
            50% { opacity: 0.2; background: color-mix(in srgb, var(--color-on-surface) 8%, transparent); box-shadow: none; }
            65% { opacity: 0.95; background: linear-gradient(90deg, transparent, var(--color-secondary), var(--color-primary), transparent); box-shadow: 0 0 35px color-mix(in srgb, var(--color-primary) 80%, transparent), 0 0 20px color-mix(in srgb, var(--color-secondary) 50%, transparent); }
            70% { opacity: 0.5; background: color-mix(in srgb, var(--color-on-surface) 8%, transparent); box-shadow: none; }
            85% { opacity: 1; background: linear-gradient(90deg, transparent, var(--color-primary), transparent); box-shadow: 0 0 35px color-mix(in srgb, var(--color-primary) 90%, transparent); }
            100% { opacity: 1; background: linear-gradient(90deg, transparent 0%, var(--color-primary) 30%, var(--color-primary) 70%, transparent 100%); box-shadow: 0 0 20px color-mix(in srgb, var(--color-primary) 80%, transparent), 0 0 35px color-mix(in srgb, var(--color-primary) 40%, transparent); }
        }

        @keyframes neon-glow {
            /* Steady Purple state */
            0%, 25%, 50%, 70%, 100% {
                background: linear-gradient(90deg, transparent 0%, var(--color-primary) 30%, var(--color-primary-dim) 70%, transparent 100%);
                box-shadow: 0 0 18px color-mix(in srgb, var(--color-primary) 65%, transparent), 0 0 28px color-mix(in srgb, var(--color-primary-dim) 35%, transparent);
                opacity: 1;
            }
            12%, 37%, 62% {
                background: linear-gradient(90deg, transparent 0%, var(--color-primary) 30%, var(--color-primary-dim) 70%, transparent 100%);
                box-shadow: 0 0 26px color-mix(in srgb, var(--color-primary) 90%, transparent), 0 0 40px color-mix(in srgb, var(--color-primary) 45%, transparent);
                opacity: 1;
            }

            /* 40%: single realistic quick neon double-flicker */
            40% {
                background: linear-gradient(90deg, transparent 0%, var(--color-primary) 30%, var(--color-primary-dim) 70%, transparent 100%);
                box-shadow: 0 0 6px color-mix(in srgb, var(--color-primary) 25%, transparent), 0 0 10px color-mix(in srgb, var(--color-primary-dim) 10%, transparent);
                opacity: 0.55;
            }
            40.4% {
                background: linear-gradient(90deg, transparent 0%, var(--color-primary) 30%, var(--color-primary-dim) 70%, transparent 100%);
                box-shadow: 0 0 22px color-mix(in srgb, var(--color-primary) 80%, transparent);
                opacity: 0.95;
            }
            40.8% {
                background: linear-gradient(90deg, transparent 0%, var(--color-primary) 30%, var(--color-primary-dim) 70%, transparent 100%);
                box-shadow: 0 0 8px color-mix(in srgb, var(--color-primary) 35%, transparent);
                opacity: 0.65;
            }
            41.5% {
                background: linear-gradient(90deg, transparent 0%, var(--color-primary) 30%, var(--color-primary-dim) 70%, transparent 100%);
                box-shadow: 0 0 18px color-mix(in srgb, var(--color-primary) 65%, transparent);
                opacity: 1;
            }

            /* 75% to 88%: Slow rare drift to cyan/blue and back */
            75% {
                background: linear-gradient(90deg, transparent 0%, var(--color-primary) 30%, var(--color-primary-dim) 70%, transparent 100%);
                box-shadow: 0 0 18px color-mix(in srgb, var(--color-primary) 65%, transparent);
                opacity: 1;
            }
            82% {
                background: linear-gradient(90deg, transparent 0%, var(--color-primary) 15%, var(--color-secondary) 80%, transparent 100%);
                box-shadow: 0 0 24px color-mix(in srgb, var(--color-primary) 65%, transparent), 0 0 35px color-mix(in srgb, var(--color-secondary) 50%, transparent);
                opacity: 1;
            }
            88% {
                background: linear-gradient(90deg, transparent 0%, var(--color-primary) 30%, var(--color-primary-dim) 70%, transparent 100%);
                box-shadow: 0 0 18px color-mix(in srgb, var(--color-primary) 65%, transparent);
                opacity: 1;
            }
            
            /* 90%: a quick micro-flicker while returning to purple */
            90% {
                background: linear-gradient(90deg, transparent 0%, var(--color-primary) 30%, var(--color-primary-dim) 70%, transparent 100%);
                box-shadow: 0 0 5px color-mix(in srgb, var(--color-primary) 20%, transparent);
                opacity: 0.5;
            }
            90.4% {
                background: linear-gradient(90deg, transparent 0%, var(--color-primary) 30%, var(--color-primary-dim) 70%, transparent 100%);
                box-shadow: 0 0 18px color-mix(in srgb, var(--color-primary) 65%, transparent);
                opacity: 1;
            }
        }
    </style>
</head>

<body class="bg-background text-on-background font-body selection:bg-primary/30 antialiased overflow-hidden">

    <!-- Custom title bar -->
    <div id="titlebar" class="fixed top-0 left-0 right-0 flex items-stretch z-[9999]"
        style="background:var(--color-background);">
        <div data-tauri-drag-region class="flex-1 flex items-center px-4 gap-2">
            <span class="material-symbols-outlined text-primary" style="font-size:16px;">blur_on</span>
            <span class="font-headline text-xs font-bold uppercase tracking-widest text-primary/60">ZAPRET_</span>
        </div>
        <button id="tb-minimize" class="titlebar-btn" data-i18n="minimize" data-i18n-attr="title" title="Minimize">
            <span class="material-symbols-outlined text-on-surface-variant">remove</span>
        </button>
        <button id="tb-maximize" class="titlebar-btn" data-i18n="maximize" data-i18n-attr="title" title="Maximize">
            <span id="tb-maximize-icon" class="material-symbols-outlined text-on-surface-variant">crop_square</span>
        </button>
        <button id="tb-close" class="titlebar-btn close" data-i18n="close" data-i18n-attr="title" title="Close">
            <span class="material-symbols-outlined text-on-surface-variant">close</span>
        </button>
    </div>

    <!-- Close menu (right-click on close button) -->
    <div id="tb-close-menu" class="hidden fixed z-[10000] rounded-xl border border-primary/20 overflow-hidden shadow-2xl py-1"
        style="background:var(--color-popup); min-width: 200px;">
        <button id="tb-close-menu-tray" class="w-full text-left px-4 py-2 text-xs font-headline text-on-surface hover:bg-primary/10 flex items-center gap-2">
            <span class="material-symbols-outlined text-sm text-primary/60">keyboard_arrow_down</span>
            <span data-i18n="close_menu_tray">Minimize to tray</span>
        </button>
        <button id="tb-close-menu-exit" class="w-full text-left px-4 py-2 text-xs font-headline text-on-surface hover:bg-primary/10 flex items-center gap-2">
            <span class="material-symbols-outlined text-sm text-error-dim">close</span>
            <span data-i18n="close_menu_exit">Exit application</span>
        </button>
    </div>

    <aside
        class="fixed top-[30px] bottom-3 left-2 w-[72px] flex flex-col py-5 items-center z-50 border border-outline-variant/10 rounded-xl shadow-2xl overflow-hidden"
        style="background: var(--color-sidebar);">
        <!-- Sliding active indicator bar -->
        <div id="nav-indicator"></div>
        <div class="text-primary font-black mt-3 mb-5">
            <span class="material-symbols-outlined" style="font-variation-settings: 'opsz' 40; font-size:28px;">blur_on</span>
        </div>
        <nav class="flex flex-col gap-4 w-full items-center flex-1">
            <a href="#"
                class="w-12 h-12 flex items-center justify-center rounded-xl transition-all duration-200 cursor-pointer nav-active"
                data-i18n="nav_home" data-i18n-attr="title" title="Home">
                <span class="material-symbols-outlined">home</span>
            </a>
            <a href="#" id="nav-sites"
                class="w-12 h-12 flex items-center justify-center rounded-xl transition-all duration-200 cursor-pointer nav-inactive"
                data-i18n="nav_sites" data-i18n-attr="title" title="Site Lists">
                <span class="material-symbols-outlined">language</span>
            </a>
            <a href="#" id="nav-ips"
                class="w-12 h-12 flex items-center justify-center rounded-xl transition-all duration-200 cursor-pointer nav-inactive"
                data-i18n="nav_ips" data-i18n-attr="title" title="IP Settings">
                <span class="material-symbols-outlined">settings_input_component</span>
            </a>
            <a href="#" id="nav-diagnostics"
                class="w-12 h-12 flex items-center justify-center rounded-xl transition-all duration-200 cursor-pointer nav-inactive"
                data-i18n="nav_diagnostics" data-i18n-attr="title" title="Diagnostics">
                <span class="material-symbols-outlined">stethoscope</span>
            </a>
            <a href="#" id="nav-traffic"
                class="w-12 h-12 flex items-center justify-center rounded-xl transition-all duration-200 cursor-pointer nav-inactive"
                data-i18n="nav_traffic" data-i18n-attr="title" title="Traffic Monitor">
                <span class="material-symbols-outlined">monitoring</span>
            </a>
        </nav>
        <!-- Settings at bottom -->
        <div class="pb-3">
            <a href="#" id="nav-settings"
                class="w-12 h-12 flex items-center justify-center rounded-xl transition-all duration-200 cursor-pointer nav-inactive"
                data-i18n="settings" data-i18n-attr="title" title="Settings">
                <span class="material-symbols-outlined">settings</span>
            </a>
        </div>
    </aside>

    <header
        class="fixed top-[42px] right-3 left-[88px] flex justify-between items-center px-6 h-16 z-40 rounded-3xl" style="background: color-mix(in srgb, var(--color-sidebar) 90%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);">
        <div class="flex flex-col">
            <span class="text-primary font-headline text-lg font-bold uppercase tracking-widest">ZAPRET_</span>
            <span id="header-status"
                class="text-[10px] text-error-dim font-bold uppercase tracking-[0.2em] opacity-80"><span data-i18n="status_label">Status</span>:
                <span data-i18n="status_disconnected">Disconnected</span></span>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex flex-col items-end">
                <span class="text-[9px] text-primary/40 uppercase tracking-widest font-bold" data-i18n="ui_version">UI VERSION</span>
                <span id="ui-version-display" class="text-[11px] text-primary font-bold"></span>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-[9px] text-secondary/40 uppercase tracking-widest font-bold" data-i18n="core_version">ZAPRET CORE</span>
                <span id="version-display" class="text-[11px] text-secondary font-bold">vNONE</span>
            </div>
            <button id="check-updates-btn" data-i18n="check_updates" data-i18n-attr="title" title="Check Updates"
                class="flex items-center justify-center w-10 h-10 bg-surface-container-high/50 border border-outline-variant/20 rounded-xl text-primary/70 hover:text-primary transition-all">
                <span class="material-symbols-outlined text-base">update</span>
            </button>
        </div>
    </header>

    <main id="sections-host" class="ml-[80px] pt-20 h-[calc(100vh-30px)] overflow-x-hidden overflow-y-auto bg-surface" style="margin-top:30px;">
        <!-- Section fragments are injected here by src/components/index.js -->
    </main>

    <!-- Top-level modals and overlays are injected here by src/components/index.js -->
    <div id="modals-host"></div>

    <div class="fixed top-0 right-0 w-[600px] h-[600px] bg-primary/5 rounded-full blur-[120px] pointer-events-none -z-10 opacity-50"></div>
    <div class="fixed bottom-0 left-20 w-[400px] h-[400px] bg-tertiary/5 rounded-full blur-[100px] pointer-events-none -z-10 opacity-30"></div>

    <script type="module" src="/main.js"></script>
</body>

</html>
