<!-- Status Modal -->
<div id="status-modal"
    class="hidden fixed inset-0 ui-overlay z-50 flex items-center justify-center p-4"
    role="dialog" aria-modal="true" aria-labelledby="status-modal-title">
    <div class="ui-dialog-surface p-6 max-w-xl w-full max-h-[90vh] overflow-y-auto"
       >
        <div class="flex items-center justify-between gap-4 mb-5">
            <div class="flex items-center gap-3 min-w-0">
                <span class="material-symbols-outlined text-secondary text-2xl">query_stats</span>
                <h3 id="status-modal-title" class="font-headline text-lg font-bold text-on-surface" data-i18n="system_status">ZAPRET Status</h3>
            </div>
            <button id="status-modal-close" type="button"
                class="ui-icon-button"
                data-i18n="close" data-i18n-attr="aria-label" aria-label="Close">
                <span class="material-symbols-outlined text-xl">close</span>
            </button>
        </div>
        <div id="status-content" class="space-y-3" aria-live="polite" aria-busy="false">
            <div class="rounded-xl bg-surface-container-high/70 p-5 text-sm text-on-surface-variant" data-i18n="checking_status">
                Checking status...
            </div>
        </div>
        <div class="mt-6 flex justify-end">
            <button id="status-modal-done" type="button"
                class="ui-button" data-i18n="close">
                Close
            </button>
        </div>
    </div>
</div>
