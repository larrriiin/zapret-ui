<!-- Info Help Modal -->
<div id="info-modal"
    class="hidden fixed inset-0 ui-overlay z-[100] flex items-center justify-center">
    <div class="ui-dialog-surface max-w-md w-full mx-4">
        <div class="flex items-center gap-3 mb-6">
            <span class="material-symbols-outlined text-primary text-2xl">help_outline</span>
            <h3 id="info-title" class="font-headline text-lg font-bold text-on-surface uppercase tracking-widest" data-i18n="information">Information</h3>
        </div>
        <div id="info-content" class="space-y-4 text-sm text-on-surface-variant leading-relaxed">
            <!-- Content injected by JS -->
        </div>
        <div class="mt-6 flex justify-end">
            <button id="info-modal-close" type="button"
                class="ui-button" data-i18n="close">
                Close
            </button>
        </div>
    </div>
</div>
