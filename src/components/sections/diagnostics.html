<!-- Diagnostics Section -->
<div id="section-diagnostics"
    class="hidden fixed top-[30px] right-0 bottom-0 left-0 ml-20 pt-20 overflow-y-auto bg-surface z-10">
    <div class="p-8 space-y-8 max-w-[1400px] mx-auto">
    <!-- Diagnostics Block -->
    <div class="ui-panel p-6 w-full">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h3 class="font-headline text-sm font-bold uppercase tracking-widest text-primary" data-i18n="diagnostics">Diagnostics</h3>
                <p class="text-xs text-on-surface-variant mt-1" data-i18n="diagnostics_desc">Check system configuration and potential issues</p>
            </div>
            <div class="flex items-center gap-2">
                <button id="diagnostics-copy-btn" class="ui-button hidden ui-button-sm">
                    <span class="material-symbols-outlined text-sm">content_copy</span>
                    <span id="diagnostics-copy-label" data-i18n="copy_report">Copy Report</span>
                </button>
                <button id="diagnostics-show-all-btn" class="ui-button hidden ui-button-sm">
                    <span class="material-symbols-outlined text-sm">visibility</span>
                    <span id="diagnostics-show-all-label" data-i18n="show_all_checks">Show All Checks</span>
                </button>
            </div>
        </div>

        <!-- Diagnostics Results -->
        <div id="diagnostics-results" class="hidden space-y-3 w-full mb-6">
            <!-- Results will be populated here -->
        </div>

        <!-- Main Action Button -->
        <button id="run-diagnostics-btn"
            class="ui-button ui-button-primary w-full mb-6">
            <span class="material-symbols-outlined text-sm">play_arrow</span>
            <span data-i18n="run_diagnostics">Run Diagnostics</span>
        </button>

        <!-- Discord Cache Clear -->
        <div id="discord-cache-section" class="hidden pt-6 border-t border-outline-variant/10">
            <div class="flex items-center justify-between">
                <div>
                    <h3 class="font-headline text-sm font-bold uppercase tracking-widest text-secondary" data-i18n="discord_cache">Discord Cache</h3>
                    <p class="text-xs text-on-surface-variant mt-1" data-i18n="discord_cache_desc">Clear Discord cache to fix potential connection issues</p>
                </div>
                <button id="clear-discord-cache-btn"
                    class="ui-button ui-button-accent" data-i18n="clear_cache">
                    Clear Cache
                </button>
            </div>
            <div id="discord-cache-status" class="hidden mt-4 text-sm"></div>
        </div>
    </div>

    <!-- Tests Section -->
    <div class="ui-panel p-6 w-full">
        <h3 class="font-headline text-sm font-bold uppercase tracking-widest text-secondary mb-4" data-i18n="tests">Tests</h3>

        <!-- Test Type Selection -->
        <div class="mb-4">
            <p class="text-xs text-on-surface-variant mb-2 uppercase tracking-wider" data-i18n="test_type">Test Type</p>
            <div class="flex flex-col sm:flex-row gap-2">
                <button id="test-type-combined" data-type="combined"
                    class="ui-button flex-1" data-i18n="test_combined">
                    Combined (recommended)
                </button>
                <button id="test-type-standard" data-type="standard"
                    class="ui-button flex-1" data-i18n="test_standard">
                    Standard (HTTP/Ping)
                </button>
                <button id="test-type-dpi" data-type="dpi"
                    class="ui-button flex-1" data-i18n="test_dpi">
                    DPI Checkers (TCP 16-20)
                </button>
            </div>
        </div>

        <!-- Run Button & Cancel -->
        <div class="flex gap-2 mb-4">
            <button id="run-tests-btn"
                class="ui-button ui-button-accent flex-1">
                <span class="material-symbols-outlined text-sm">science</span>
                <span data-i18n="run_tests">Run Tests</span>
            </button>
            <button id="cancel-tests-btn"
                class="ui-button hidden" data-i18n="cancel">
                Cancel
            </button>
        </div>

        <!-- Status -->
        <div id="tests-status" class="hidden text-sm mb-3"></div>

        <!-- Live Log -->
        <div id="tests-log"
            class="hidden bg-log rounded-xl p-3 max-h-[320px] overflow-y-auto font-mono text-xs space-y-0.5">
        </div>

        <!-- Summary Results -->
        <div id="tests-results" class="hidden mt-4 space-y-2 w-full"></div>
    </div>

    <!-- Site Checker Section -->
    <div class="ui-panel p-6 w-full mt-8">
        <h3 class="font-headline text-sm font-bold uppercase tracking-widest text-primary mb-2" data-i18n="site_checker_title">Targeted Site Checker</h3>
        <p class="text-xs text-on-surface-variant mb-4" data-i18n="site_checker_desc">Test if a specific website is accessible and check its connection status</p>

        <div class="flex gap-2 mb-4">
            <input id="site-checker-input" type="text" data-i18n="site_checker_placeholder" data-i18n-attr="placeholder" placeholder="Enter domain (e.g. google.com)" autocomplete="off" spellcheck="false"
                class="ui-field flex-1" />
            <button id="run-site-check-btn"
                class="ui-button ui-button-primary">
                <span class="material-symbols-outlined text-sm">troubleshoot</span>
                <span data-i18n="site_checker_run">Check Site</span>
            </button>
        </div>

        <!-- Checker Status & Results -->
        <div id="site-checker-results" class="hidden space-y-4 w-full">
            <!-- Results populated here -->
        </div>
    </div>
    </div>
</div>
