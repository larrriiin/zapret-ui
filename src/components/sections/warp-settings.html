<section id="section-warp-settings" class="hidden p-8 space-y-6 max-w-[1000px] mx-auto pb-24" aria-labelledby="warp-page-title">
  <header class="warp-page-heading">
    <div><div class="warp-page-title-row"><h2 id="warp-page-title" class="font-headline text-2xl font-bold text-primary" data-i18n="warp_page_title"></h2><span class="warp-experimental" data-i18n="traffic_experimental"></span></div><p class="warp-page-description" data-i18n="warp_page_description"></p></div>
    <span id="warp-page-status" class="provider-badge warp-page-status" role="status"></span>
  </header>
  <section class="glass-panel rounded-2xl border border-outline-variant/10 p-6 warp-connection-panel" aria-labelledby="warp-page-connection-title">
    <header class="warp-section-heading warp-section-heading--connection"><div class="warp-section-title"><span class="warp-section-icon"><span class="material-symbols-outlined" aria-hidden="true">settings_ethernet</span></span><div><h3 id="warp-page-connection-title" class="font-headline text-base font-bold" data-i18n="warp_port_settings"></h3><p id="warp-page-connection" class="warp-connection-copy" role="status"></p></div></div></header>
    <div id="warp-proxy" class="warp-proxy-editor" hidden><div class="warp-proxy-address"><label for="warp-proxy-endpoint" data-i18n="warp_proxy_address"></label><div class="warp-proxy-value"><p id="warp-proxy-endpoint" class="warp-endpoint"></p><button id="warp-copy-proxy" type="button" class="warp-copy-button" data-i18n="warp_copy_proxy" data-i18n-attr="aria-label"><span class="material-symbols-outlined" aria-hidden="true">content_copy</span></button></div></div><form id="warp-port-form" class="warp-port-form"><label for="warp-port" data-i18n="warp_port"></label><div class="warp-port-controls"><input id="warp-port" type="number" min="1" max="65535" step="1" required inputmode="numeric"><button id="warp-port-save" type="submit" class="provider-button" data-i18n="warp_save_port"></button></div></form></div>
  </section>
  <section id="warp-sites" class="glass-panel rounded-2xl border border-outline-variant/10 p-6 warp-rules-panel" aria-labelledby="warp-sites-title">
    <header class="warp-section-heading"><div class="warp-section-title"><span class="warp-section-icon"><span class="material-symbols-outlined" aria-hidden="true">language</span></span><h3 id="warp-sites-title" class="font-headline text-base font-bold" data-i18n="warp_sites_title"></h3><button id="warp-sites-info" type="button" class="warp-icon-button warp-title-info" data-i18n="warp_info" data-i18n-attr="aria-label"><span class="material-symbols-outlined" aria-hidden="true">info</span></button></div><div class="warp-section-actions"><button id="warp-sites-add" type="button" class="provider-button"><span class="material-symbols-outlined" aria-hidden="true">add</span><span data-i18n="warp_sites_add"></span></button><button id="warp-sites-toggle" type="button" class="warp-rule-toggle"></button></div></header>
    <textarea id="warp-sites-domains" hidden aria-hidden="true" tabindex="-1"></textarea><p id="warp-sites-empty" class="warp-list-empty" data-i18n="warp_sites_empty"></p><ul id="warp-sites-list" class="warp-rule-grid" aria-labelledby="warp-sites-title"></ul>
  </section>
  <section id="warp-apps" class="glass-panel rounded-2xl border border-outline-variant/10 p-6 warp-rules-panel" aria-labelledby="warp-apps-title">
    <header class="warp-section-heading"><div class="warp-section-title"><span class="warp-section-icon"><span class="material-symbols-outlined" aria-hidden="true">apps</span></span><h3 id="warp-apps-title" class="font-headline text-base font-bold" data-i18n="warp_apps_title"></h3><button id="warp-apps-info" type="button" class="warp-icon-button warp-title-info" data-i18n="warp_info" data-i18n-attr="aria-label"><span class="material-symbols-outlined" aria-hidden="true">info</span></button></div><div class="warp-section-actions"><button id="warp-apps-add" type="button" class="provider-button"><span class="material-symbols-outlined" aria-hidden="true">add</span><span data-i18n="warp_apps_add"></span></button><button id="warp-apps-toggle" type="button" class="warp-rule-toggle"></button></div></header>
    <p id="warp-apps-empty" class="warp-list-empty" data-i18n="warp_apps_empty"></p><ul id="warp-apps-list" class="warp-rule-grid" aria-labelledby="warp-apps-title"></ul><p id="warp-apps-counters" class="warp-rule-state"></p><p id="warp-apps-error" class="warp-error" role="status" hidden></p>
  </section>
  <p id="warp-page-error" class="warp-error" role="alert" hidden></p>
</section>
<dialog id="warp-sites-dialog" class="warp-status-dialog" aria-labelledby="warp-sites-dialog-title"><header class="flex items-center justify-between gap-4 mb-5"><div class="flex items-center gap-3 min-w-0"><span class="material-symbols-outlined text-secondary text-2xl" aria-hidden="true">language</span><h2 id="warp-sites-dialog-title" class="font-headline text-lg font-bold" data-i18n="warp_sites_add_dialog_title"></h2></div><button id="warp-sites-dialog-close" type="button" class="provider-button" data-i18n="warp_close" data-i18n-attr="aria-label"><span class="material-symbols-outlined" aria-hidden="true">close</span></button></header><label class="warp-modal-copy" for="warp-sites-input" data-i18n="warp_sites_add_dialog_hint"></label><textarea id="warp-sites-input" class="warp-sites-dialog-input" rows="6" spellcheck="false" autocomplete="off" placeholder="example.com&#10;https://example.org/path"></textarea><div class="mt-6 flex justify-end gap-2"><button id="warp-sites-dialog-add" type="button" class="provider-button" data-i18n="warp_sites_add"></button></div></dialog>
<dialog id="warp-settings-info-dialog" class="warp-status-dialog" aria-labelledby="warp-settings-info-title"><header class="flex items-center justify-between gap-4 mb-5"><div class="flex items-center gap-3 min-w-0"><span id="warp-settings-info-icon" class="material-symbols-outlined text-secondary text-2xl" aria-hidden="true">info</span><h2 id="warp-settings-info-title" class="font-headline text-lg font-bold"></h2></div><button id="warp-settings-info-close" type="button" class="provider-button" data-i18n="warp_close" data-i18n-attr="aria-label"><span class="material-symbols-outlined" aria-hidden="true">close</span></button></header><p id="warp-settings-info-text" class="warp-modal-copy"></p><code id="warp-settings-info-path" class="warp-path-code" hidden></code><form method="dialog" class="mt-6 flex justify-end"><button class="provider-button" data-i18n="warp_close"></button></form></dialog>
