<section id="section-warp-settings" class="hidden px-8 space-y-6 max-w-[1000px] mx-auto pb-24" aria-labelledby="warp-page-title">
  <header class="warp-page-heading">
    <div><div class="warp-page-title-row"><h2 id="warp-page-title" class="font-headline text-2xl font-bold text-primary" data-i18n="warp_page_title"></h2></div><p class="warp-page-description" data-i18n="warp_page_description"></p></div>
    <span id="warp-page-status" class="provider-badge warp-page-status" role="status"></span>
  </header>
  <section id="warp-sites" class="ui-panel p-6 warp-rules-panel" aria-labelledby="warp-sites-title">
    <header class="warp-section-heading"><div class="warp-section-title"><span class="warp-section-icon"><span class="material-symbols-outlined" aria-hidden="true">language</span></span><h3 id="warp-sites-title" class="font-headline text-base font-bold" data-i18n="warp_sites_title"></h3><button id="warp-sites-info" data-warp-info="sites" aria-haspopup="dialog" type="button" class="ui-icon-button warp-title-info" data-i18n="warp_info" data-i18n-attr="aria-label"><span class="material-symbols-outlined" aria-hidden="true">info</span></button></div><div class="warp-section-actions"><button id="warp-sites-add" type="button" class="ui-button"><span class="material-symbols-outlined" aria-hidden="true">add</span><span data-i18n="warp_sites_add"></span></button><button id="warp-sites-toggle" type="button" class="ui-switch"></button></div></header>
    <p id="warp-sites-state" class="warp-rule-status" role="status"></p>
    <textarea id="warp-sites-domains" hidden aria-hidden="true" tabindex="-1"></textarea><p id="warp-sites-empty" class="warp-list-empty" data-i18n="warp_sites_empty"></p><ul id="warp-sites-list" class="warp-rule-grid" aria-labelledby="warp-sites-title"></ul>
  </section>
  <section id="warp-apps" class="ui-panel p-6 warp-rules-panel" aria-labelledby="warp-apps-title">
    <header class="warp-section-heading"><div class="warp-section-title"><span class="warp-section-icon"><span class="material-symbols-outlined" aria-hidden="true">apps</span></span><h3 id="warp-apps-title" class="font-headline text-base font-bold" data-i18n="warp_apps_title"></h3><button id="warp-apps-info" data-warp-info="apps" aria-haspopup="dialog" type="button" class="ui-icon-button warp-title-info" data-i18n="warp_info" data-i18n-attr="aria-label"><span class="material-symbols-outlined" aria-hidden="true">info</span></button></div><div class="warp-section-actions"><button id="warp-apps-add" type="button" class="ui-button"><span class="material-symbols-outlined" aria-hidden="true">add</span><span data-i18n="warp_apps_add"></span></button><button id="warp-apps-toggle" type="button" class="ui-switch"></button></div></header>
    <p id="warp-apps-state" class="warp-rule-status" role="status"></p>
    <p id="warp-apps-empty" class="warp-list-empty" data-i18n="warp_apps_empty"></p><ul id="warp-apps-list" class="warp-rule-grid" aria-labelledby="warp-apps-title"></ul>
  </section>
  <details id="warp-advanced" class="ui-disclosure glass-panel">
    <summary class="ui-disclosure-summary"><span class="ui-disclosure-heading"><span class="material-symbols-outlined" aria-hidden="true">tune</span><span class="ui-disclosure-title" data-i18n="advanced_settings"></span></span><span class="material-symbols-outlined ui-disclosure-chevron" aria-hidden="true">expand_more</span></summary>
    <div class="warp-advanced-body">
      <div class="warp-preference"><div class="warp-setting-label"><span id="warp-auto-restore-label" data-i18n="warp_auto_restore"></span><button type="button" class="ui-icon-button warp-title-info" data-warp-info="restore" aria-haspopup="dialog"><span class="material-symbols-outlined" aria-hidden="true">info</span></button></div><button id="warp-auto-restore" class="ui-switch" type="button" aria-labelledby="warp-auto-restore-label"></button></div>
      <div class="warp-preference warp-protocol-setting"><div class="warp-setting-label"><span id="warp-protocol-title" data-i18n="warp_protocol"></span><button type="button" class="ui-icon-button warp-title-info" data-warp-info="protocol" aria-haspopup="dialog"><span class="material-symbols-outlined" aria-hidden="true">info</span></button></div>
        <div id="warp-protocol-dropdown" class="relative warp-protocol-dropdown">
          <button id="warp-protocol-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="warp-protocol-options" aria-labelledby="warp-protocol-title warp-protocol-label" aria-describedby="warp-protocol-hint" class="ui-select-trigger"><span id="warp-protocol-label" class="truncate text-on-surface"></span><span id="warp-protocol-chevron" class="material-symbols-outlined text-primary/60 text-base ml-2 transition-transform" aria-hidden="true">expand_more</span></button>
          <select id="warp-protocol" hidden tabindex="-1" aria-hidden="true"><option value="MASQUE">MASQUE</option><option value="WireGuard">WireGuard</option></select>
          <div id="warp-protocol-options" class="ui-select-popup" hidden><div id="warp-protocol-options-list" class="py-1" role="listbox" aria-labelledby="warp-protocol-title"></div></div>
        </div>
      </div>
      <p id="warp-protocol-hint" class="warp-connection-copy" role="status" hidden></p>
    <div id="warp-proxy" class="warp-proxy-editor" hidden><div class="warp-proxy-address"><div class="warp-setting-label"><span id="warp-proxy-address-label" data-i18n="warp_proxy_address"></span><button type="button" class="ui-icon-button warp-title-info" data-warp-info="address" aria-haspopup="dialog"><span class="material-symbols-outlined" aria-hidden="true">info</span></button></div><div class="warp-proxy-value"><p id="warp-proxy-endpoint" class="warp-endpoint" aria-labelledby="warp-proxy-address-label"></p><button id="warp-copy-proxy" type="button" class="warp-copy-button" data-i18n="warp_copy_proxy" data-i18n-attr="aria-label"><span class="material-symbols-outlined" aria-hidden="true">content_copy</span></button></div></div><form id="warp-port-form" class="warp-port-form"><div class="warp-setting-label"><label for="warp-port" data-i18n="warp_port"></label><button type="button" class="ui-icon-button warp-title-info" data-warp-info="port" aria-haspopup="dialog"><span class="material-symbols-outlined" aria-hidden="true">info</span></button></div><div class="warp-port-controls"><input id="warp-port" type="number" min="1" max="65535" step="1" required inputmode="numeric" class="ui-field"><button id="warp-port-save" type="submit" class="ui-button" data-i18n="warp_save_port"></button></div></form></div>

      <section class="warp-diagnostics" aria-labelledby="warp-diagnostics-title">
        <div class="warp-setting-label"><h3 id="warp-diagnostics-title" class="font-headline text-base font-bold" data-i18n="warp_diagnostics"></h3><button type="button" class="ui-icon-button warp-title-info" data-warp-info="diagnostics" aria-haspopup="dialog"><span class="material-symbols-outlined" aria-hidden="true">info</span></button></div>
        <p id="warp-diag-support" class="warp-connection-copy" data-i18n="warp_diag_unavailable" hidden></p>
        <div class="warp-diagnostic-actions">
          <button id="warp-view-traffic" type="button" class="ui-button"><span class="material-symbols-outlined" aria-hidden="true">monitoring</span><span data-i18n="warp_view_traffic"></span></button>
          <button id="warp-diag-create" type="button" class="ui-button"><span class="material-symbols-outlined" aria-hidden="true">folder_zip</span><span id="warp-diag-create-label" data-i18n="warp_diag_create"></span></button>
        </div>
        <button id="warp-diag-reveal" type="button" class="ui-button warp-diagnostic-reveal" data-i18n="warp_diag_reveal" hidden></button>
        <p id="warp-diag-result" class="warp-connection-copy" role="status"></p>
      </section>
    </div>
  </details>

  <p id="warp-page-error" class="warp-error" role="alert" hidden></p>
</section>
<dialog id="warp-sites-dialog" class="ui-dialog" aria-labelledby="warp-sites-dialog-title"><header class="flex items-center justify-between gap-4 mb-5"><div class="flex items-center gap-3 min-w-0"><span class="material-symbols-outlined text-secondary text-2xl" aria-hidden="true">language</span><h2 id="warp-sites-dialog-title" class="font-headline text-lg font-bold" data-i18n="warp_sites_add_dialog_title"></h2></div><button id="warp-sites-dialog-close" type="button" class="ui-button" data-i18n="warp_close" data-i18n-attr="aria-label"><span class="material-symbols-outlined" aria-hidden="true">close</span></button></header><label class="warp-modal-copy" for="warp-sites-input" data-i18n="warp_sites_add_dialog_hint"></label><textarea id="warp-sites-input" class="ui-field ui-field-multiline" rows="6" spellcheck="false" autocomplete="off" placeholder="example.com&#10;https://example.org/path"></textarea><div class="mt-6 flex justify-end gap-2"><button id="warp-sites-dialog-add" type="button" class="ui-button" data-i18n="warp_sites_add"></button></div></dialog>
<dialog id="warp-settings-info-dialog" class="ui-dialog" aria-labelledby="warp-settings-info-title"><header class="flex items-center justify-between gap-4 mb-5"><div class="flex items-center gap-3 min-w-0"><span id="warp-settings-info-icon" class="material-symbols-outlined text-secondary text-2xl" aria-hidden="true">info</span><h2 id="warp-settings-info-title" class="font-headline text-lg font-bold"></h2></div><button id="warp-settings-info-close" type="button" class="ui-button" data-i18n="warp_close" data-i18n-attr="aria-label"><span class="material-symbols-outlined" aria-hidden="true">close</span></button></header><p id="warp-settings-info-text" class="warp-modal-copy"></p><code id="warp-settings-info-path" class="warp-path-code" hidden></code><form method="dialog" class="mt-6 flex justify-end"><button class="ui-button" data-i18n="warp_close"></button></form></dialog>
