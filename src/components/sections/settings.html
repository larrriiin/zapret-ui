<!-- Settings Section -->
<div id="section-settings" class="hidden p-8 space-y-6 max-w-[600px] mx-auto h-full overflow-y-auto pb-24">

    <h2 class="font-headline text-[10px] font-bold uppercase tracking-[0.2em] text-primary/70" data-i18n="settings">Settings</h2>

    <!-- Language -->
    <div class="glass-panel rounded-2xl border border-outline-variant/10 p-6 space-y-3">
        <div class="text-sm text-on-surface font-headline font-bold" data-i18n="language_label">Language</div>
        <div class="flex flex-col gap-1">
            <label class="flex items-center gap-2 text-xs text-on-surface cursor-pointer px-2 py-1.5 rounded hover:bg-primary/10">
                <input type="radio" name="lang-pref" value="ru" class="border-outline-variant/30 bg-surface-container-highest text-primary h-4 w-4">
                <span>Русский (RU)</span>
            </label>
            <label class="flex items-center gap-2 text-xs text-on-surface cursor-pointer px-2 py-1.5 rounded hover:bg-primary/10">
                <input type="radio" name="lang-pref" value="en" class="border-outline-variant/30 bg-surface-container-highest text-primary h-4 w-4">
                <span>English (EN)</span>
            </label>
        </div>
    </div>

    <!-- Autostart -->
    <div class="glass-panel rounded-2xl border border-outline-variant/10 p-6">
        <label class="flex items-start justify-between gap-3 cursor-pointer">
            <div class="flex-1">
                <div class="text-sm text-on-surface font-headline font-bold" data-i18n="autostart_label">Launch on Windows startup</div>
                <div class="text-[10px] text-on-surface-variant mt-1" data-i18n="autostart_hint">Start minimized to tray</div>
            </div>
            <button id="autostart-toggle" type="button" class="toggle-btn is-off flex-shrink-0 relative w-12 h-6 rounded-full transition-colors">
                <span class="toggle-thumb absolute top-0.5 left-0.5 w-5 h-5 bg-primary rounded-full shadow"></span>
            </button>
        </label>
    </div>

    <!-- Core rollback -->
    <div id="core-rollback-panel" class="glass-panel rounded-2xl border border-outline-variant/10 p-6 space-y-3">
        <div class="text-sm text-on-surface font-headline font-bold" data-i18n="core_rollback_title">Core rollback</div>
        <div class="text-[10px] text-on-surface-variant">
            <span data-i18n="core_current_version">Current version</span>: <span id="core-current-install-version">—</span>
        </div>
        <div id="core-previous-version-row" class="hidden text-[10px] text-on-surface-variant">
            <span data-i18n="core_previous_version">Previous version</span>: <span id="core-previous-install-version">—</span>
        </div>
        <button id="core-rollback-btn" type="button" disabled
            class="hidden px-4 py-2 bg-secondary/20 hover:bg-secondary/30 disabled:opacity-40 border border-secondary/20 rounded-xl text-xs font-bold text-secondary transition-all">
        </button>
    </div>

    <!-- Close button behavior -->
    <div class="glass-panel rounded-2xl border border-outline-variant/10 p-6 space-y-3">
        <div class="text-sm text-on-surface font-headline font-bold" data-i18n="close_pref_label">When the close button is clicked</div>
        <div class="flex flex-col gap-1">
            <label class="flex items-center gap-2 text-xs text-on-surface cursor-pointer px-2 py-1.5 rounded hover:bg-primary/10">
                <input type="radio" name="close-pref" value="ask" class="border-outline-variant/30 bg-surface-container-highest text-primary h-4 w-4">
                <span data-i18n="close_pref_ask">Ask every time</span>
            </label>
            <label class="flex items-center gap-2 text-xs text-on-surface cursor-pointer px-2 py-1.5 rounded hover:bg-primary/10">
                <input type="radio" name="close-pref" value="tray" class="border-outline-variant/30 bg-surface-container-highest text-primary h-4 w-4">
                <span data-i18n="close_pref_tray">Minimize to tray</span>
            </label>
            <label class="flex items-center gap-2 text-xs text-on-surface cursor-pointer px-2 py-1.5 rounded hover:bg-primary/10">
                <input type="radio" name="close-pref" value="exit" class="border-outline-variant/30 bg-surface-container-highest text-primary h-4 w-4">
                <span data-i18n="close_pref_exit">Exit application</span>
            </label>
        </div>
    </div>

</div><!-- /section-settings -->
