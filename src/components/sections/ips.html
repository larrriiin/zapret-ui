<!-- IPs Section -->
<div id="section-ips"
    class="hidden fixed top-[30px] right-0 bottom-0 left-0 ml-20 pt-20 overflow-y-auto bg-surface z-10">
    <div class="p-8 space-y-6 pb-24 max-w-[1400px] mx-auto">
    <div class="flex items-center justify-between mb-4">
        <h2 class="font-headline text-2xl font-bold text-primary" data-i18n="ip_settings">IP Settings</h2>
        <div class="flex gap-2">
            <button id="ip-backup-export-btn"
                class="px-4 py-2 bg-surface-container-high/40 border border-outline-variant/20 hover:border-primary/50 hover:text-primary rounded-xl text-on-surface-variant font-bold text-xs uppercase tracking-wider transition-all flex items-center gap-1.5">
                <span class="material-symbols-outlined text-sm">backup</span>
                <span data-i18n="backup_export_btn">Create Backup</span>
            </button>
            <button id="ip-backup-import-btn"
                class="px-4 py-2 bg-surface-container-high/40 border border-outline-variant/20 hover:border-primary/50 hover:text-primary rounded-xl text-on-surface-variant font-bold text-xs uppercase tracking-wider transition-all flex items-center gap-1.5">
                <span class="material-symbols-outlined text-sm">settings_backup_restore</span>
                <span data-i18n="backup_import_btn">Restore Backup</span>
            </button>
        </div>
    </div>

    <div class="flex flex-col gap-6 w-full">
        <!-- Update IPSet List Block -->
        <div class="glass-panel rounded-2xl border border-primary/10 p-6 w-full">
            <div class="flex items-center justify-between">
                <div>
                    <h3 class="font-headline text-sm font-bold uppercase tracking-widest text-secondary" data-i18n="update_ipset">Update IPSet List</h3>
                    <p class="text-xs text-on-surface-variant mt-1" data-i18n="update_ipset_desc">Download latest IP ranges for filtering</p>
                </div>
                <button id="ipset-update-btn"
                    class="px-8 py-3 bg-primary rounded-xl text-on-primary font-bold text-xs uppercase tracking-wider hover:bg-primary-dim transition-colors flex items-center gap-2">
                    <span class="material-symbols-outlined text-sm">download</span>
                    <span data-i18n="update_btn">Update</span>
                </button>
            </div>
            <div id="ipset-update-status" class="hidden mt-4 text-sm"></div>
        </div>

        <!-- IP Exclude Block -->
        <div class="glass-panel rounded-2xl border border-primary/10 p-6 w-full">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-6">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-1.5">
                        <h3 class="font-headline text-sm font-bold uppercase tracking-widest text-tertiary" data-i18n="ip_exclude">IP Exclude</h3>
                        <button id="ip-exclude-info-btn" class="text-tertiary/40 hover:text-tertiary transition-colors flex">
                            <span class="material-symbols-outlined text-sm">info</span>
                        </button>
                    </div>
                    <p class="text-xs text-on-surface-variant mt-1" data-i18n="ip_exclude_desc">IP addresses and ranges that will bypass Zapret filtering</p>
                </div>
                <div class="flex gap-2 w-full md:w-1/2">
                    <input type="text" id="ip-exclude-input" placeholder="192.168.1.1 or 10.0.0.0/24" data-i18n="placeholder_ip" data-i18n-attr="placeholder" autocomplete="off" spellcheck="false"
                        class="flex-1 bg-surface-container-highest border border-outline-variant/30 rounded-xl px-4 py-2 text-sm outline-none focus:border-primary/50">
                    <button id="ip-exclude-add"
                        class="px-6 py-2 bg-tertiary rounded-xl text-white font-bold text-xs uppercase tracking-wider hover:opacity-80 transition-colors" data-i18n="add">
                        Add
                    </button>
                </div>
            </div>
            <div class="flex items-center justify-between gap-3 mb-4">
                <div class="flex gap-2 flex-1">
                    <button id="ip-exclude-bulk-btn"
                        class="flex-1 py-2 bg-surface-container-high/40 border border-outline-variant/10 hover:border-tertiary/40 hover:text-tertiary rounded-xl text-on-surface-variant font-bold text-[10px] uppercase tracking-wider transition-all flex items-center justify-center gap-1.5">
                        <span class="material-symbols-outlined text-sm">playlist_add</span>
                        <span data-i18n="bulk_add_btn">Bulk Add</span>
                    </button>
                    <button id="ip-exclude-export-btn"
                        class="flex-1 py-2 bg-surface-container-high/40 border border-outline-variant/10 hover:border-tertiary/40 hover:text-tertiary rounded-xl text-on-surface-variant font-bold text-[10px] uppercase tracking-wider transition-all flex items-center justify-center gap-1.5">
                        <span class="material-symbols-outlined text-sm">share</span>
                        <span data-i18n="export_btn">Share</span>
                    </button>
                </div>
                <div class="flex items-center gap-2">
                    <button id="ip-exclude-search-toggle" class="text-tertiary/40 hover:text-tertiary transition-colors flex p-1 rounded hover:bg-white/5">
                        <span class="material-symbols-outlined text-lg">search</span>
                    </button>
                    <button id="ip-exclude-clear-btn" class="text-error-dim/40 hover:text-error-dim transition-colors flex p-1 rounded hover:bg-white/5">
                        <span class="material-symbols-outlined text-lg">delete</span>
                    </button>
                </div>
            </div>
            <div id="ip-exclude-search-container" class="relative mb-3 hidden">
                <input type="text" id="ip-exclude-search" data-i18n="search_placeholder" data-i18n-attr="placeholder" autocomplete="off" spellcheck="false"
                    class="w-full bg-surface-container-high/40 border border-outline-variant/20 rounded-xl pl-9 pr-4 py-1.5 text-xs outline-none focus:border-primary/50 text-on-surface">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-xs">search</span>
            </div>
            <div id="ip-exclude-list" class="multi-column-list">
                <!-- Dynamic list -->
            </div>
        </div>
    </div>
    </div>
</div>
