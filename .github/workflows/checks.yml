name: "CI"

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly audit so newly-disclosed CVEs in pinned crates don't sit unnoticed.
    - cron: "0 6 * * 1"

jobs:
  frontend-checks:
    # Runs on every PR and push to main to catch silent version drift between
    # package.json, Cargo.toml and tauri.conf.json before it reaches a tag.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Verify version strings are in sync
        run: node scripts/check-versions.mjs
      - name: Verify native NSIS updater manifest
        run: node --test scripts/prepare-installer-update.test.mjs
      - name: Verify Windows installer identity migration
        run: node --test scripts/installer-identity.test.mjs
      - name: Verify VirusTotal release integration
        run: node --test scripts/virustotal-release.test.mjs
      - name: Verify manual release selection
        run: node --test scripts/resolve-release.test.mjs
      - name: Test Flowseal version comparison
        run: npm run test:flowseal-version
      - name: Verify UI translations
        run: npm run test:i18n
      - name: Verify update proxy privacy
        run: npm run test:update-privacy
      - name: Verify first-run state recovery
        run: npm run test:first-run

  rust-checks:
    # The backend uses Windows-only extension traits (e.g. std::os::windows::
    # process::CommandExt::creation_flags), so clippy must run on a Windows
    # runner just like the native build CI.
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"
          shared-key: "zapret-ui-rust-cache-clippy"

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - name: cargo clippy
        working-directory: src-tauri
        # Blocking: check library, binaries, and test targets so test-only
        # feature/configuration mistakes cannot bypass CI.
        run: cargo clippy --all-targets --no-deps -- -D warnings

  cargo-audit:
    # cargo-audit is pure crate-metadata analysis, so it runs on Linux even
    # though the application itself is built and linted on Windows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: cargo audit
        working-directory: src-tauri
        # Don't fail the job on findings yet — this is a visibility-first
        # rollout; treat it as informational until the team decides to gate on
        # it.
        continue-on-error: true
        run: cargo audit
