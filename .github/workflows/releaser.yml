name: "publish"
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to rebuild (must match the selected branch version, e.g. v26.9.4)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
      - name: Verify version consistency
        run: node scripts/check-versions.mjs
      - name: Resolve target release
        id: release
        uses: actions/github-script@v8
        with:
          script: |
            const resolveRelease = require('./scripts/resolve-release.cjs');
            const config = require('./src-tauri/tauri.conf.json');
            await resolveRelease({ github, context, core, tag: process.env.RELEASE_TAG, version: config.version });
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'
          shared-key: 'zapret-ui-rust-cache'
      - name: install frontend dependencies
        run: npm install
      - name: Test branded updater compatibility
        shell: powershell
        run: |
          ./scripts/test-installer.ps1
          node --test scripts/prepare-installer-update.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Updater manifest tests failed.' }
          node --test scripts/resolve-release.test.mjs
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZAPRET_UPDATE_PROXY: ${{ secrets.ZAPRET_UPDATE_PROXY }}
        with:
          releaseId: ${{ steps.release.outputs.release_id }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Zapret-UI ${{ env.RELEASE_TAG }}"
          releaseBody: "See the assets below for the latest installers and update artifacts."
          releaseDraft: ${{ steps.release.outputs.draft }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          # The final manifest is generated below from this run's signed bundles.
          uploadUpdaterJson: false
      - name: Build branded Windows installer
        shell: powershell
        run: ./scripts/build-installer.ps1
      - name: Sign and connect branded Windows updater
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-Item artifacts/installer/*-branded-setup.exe
          node node_modules/@tauri-apps/cli/tauri.js signer sign $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Failed to sign branded updater.' }
          node scripts/prepare-installer-update.mjs artifacts/installer/latest.json $installer.FullName --from-bundle src-tauri/target/release/bundle
          if ($LASTEXITCODE -ne 0) { throw 'Failed to prepare branded updater manifest.' }
          gh release upload $env:RELEASE_TAG $installer.FullName "$($installer.FullName).sig" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload branded updater.' }
          gh release upload $env:RELEASE_TAG artifacts/installer/latest.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload updater manifest.' }
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish completed release.' }
