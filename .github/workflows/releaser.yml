name: "publish"
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to rebuild (must match the selected branch version, e.g. v26.9.4)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

concurrency:
  # Serialize releases sharing the public VirusTotal API quota.
  group: publish
  cancel-in-progress: false

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
      - name: Check VirusTotal configuration
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VIRUSTOTAL_API_KEY)) {
            throw 'Add the VIRUSTOTAL_API_KEY repository secret in Settings > Secrets and variables > Actions.'
          }
      - name: Verify VirusTotal integration
        run: node --test scripts/virustotal-release.test.mjs
      - name: Verify version consistency
        run: node scripts/check-versions.mjs
      - name: Resolve target release
        id: release
        uses: actions/github-script@v8
        with:
          script: |
            const resolveRelease = require('./scripts/resolve-release.cjs');
            const config = require('./src-tauri/tauri.conf.json');
            await resolveRelease({ github, context, core, tag: process.env.RELEASE_TAG, version: config.version });
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'
          shared-key: 'zapret-ui-rust-cache'
      - name: install frontend dependencies
        run: npm install
      - name: Test updater compatibility
        shell: powershell
        run: |
          node --test scripts/prepare-installer-update.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Updater manifest tests failed.' }
          node --test scripts/resolve-release.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Release selection tests failed.' }
          node --test scripts/installer-identity.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installer identity migration tests failed.' }
          node --test scripts/update-check-privacy.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Update proxy privacy tests failed.' }
          node --test scripts/first-run-state.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'First-run state tests failed.' }
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZAPRET_UPDATE_PROXY: ${{ secrets.ZAPRET_UPDATE_PROXY }}
        with:
          releaseId: ${{ steps.release.outputs.release_id }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "ZAPRET UI ${{ env.RELEASE_TAG }}"
          releaseBody: |
            See the assets below for the latest installers and update artifacts.
          releaseDraft: ${{ steps.release.outputs.draft }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          # The final manifest is generated below from this run's signed bundles.
          uploadUpdaterJson: false
      - name: Connect native NSIS updater
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*_${version}_x64-setup.exe" |
            Where-Object { $_.Name -notlike '*-branded-setup.exe' })
          if ($installers.Count -ne 1) {
            throw "Expected exactly one native NSIS installer for version ${version}; found $($installers.Count)."
          }
          $installer = $installers[0]
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          node scripts/prepare-installer-update.mjs artifacts/installer/latest.json $installer.FullName --from-bundle src-tauri/target/release/bundle
          if ($LASTEXITCODE -ne 0) { throw 'Failed to prepare NSIS updater manifest.' }
          gh release upload $env:RELEASE_TAG $installer.FullName "$($installer.FullName).sig" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload NSIS updater.' }
          gh release upload $env:RELEASE_TAG artifacts/installer/latest.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload updater manifest.' }
          # Only retire the obsolete wrapper after its native replacement and
          # manifest are available, including when rebuilding an existing release.
          $assets = gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to list release assets.' }
          foreach ($legacy in @(
            "ZAPRET_${version}_x64-setup.exe",
            "ZAPRET_${version}_x64-setup.exe.sig",
            "ZAPRET_${version}_x64_en-US.msi",
            "ZAPRET_${version}_x64_en-US.msi.sig",
            "ZAPRET_${version}_x64-branded-setup.exe",
            "ZAPRET_${version}_x64-branded-setup.exe.sig"
          )) {
            if ($assets -contains $legacy) {
              gh release delete-asset $env:RELEASE_TAG $legacy --yes
              if ($LASTEXITCODE -ne 0) { throw 'Failed to retire obsolete wrapper asset.' }
            }
          }
      - name: Scan installers and update release security sections
        timeout-minutes: 35
        uses: actions/github-script@v8
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { resolve } = require('node:path');
            const { scanRelease } = await import(pathToFileURL(resolve('scripts/virustotal-release.mjs')).href);
            const config = require('./src-tauri/tauri.conf.json');
            const { data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag: process.env.RELEASE_TAG });
            await scanRelease({ github, context, core, apiKey: process.env.VIRUSTOTAL_API_KEY,
              releaseId: release.id, version: config.version });
      - name: Publish completed release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit $env:RELEASE_TAG --title "ZAPRET UI $env:RELEASE_TAG" --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish the completed release.' }
