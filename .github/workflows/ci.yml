name: "Cache Builder"
on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-cache:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'
          shared-key: 'zapret-ui-rust-cache'
          
      - name: install frontend dependencies
        run: npm install
      - name: Test installer engine
        shell: powershell
        run: ./scripts/test-installer.ps1
      - name: Compile installer preview
        shell: powershell
        run: ./scripts/build-installer.ps1 -Preview
        
      # We simply build the app to generate and save the cache for future tags.
      # No signing or release steps are needed here.
      - name: Build to populate cache
        env:
          ZAPRET_UPDATE_PROXY: ${{ secrets.ZAPRET_UPDATE_PROXY }}
        run: |
          npx tauri build --no-bundle
