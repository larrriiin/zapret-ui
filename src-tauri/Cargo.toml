[package]
name = "zapret-ui"
version = "26.9.7"
description = "A Windows desktop interface for installing, configuring, and running Zapret"
authors = ["larrriiin"]
edition = "2021"
license = "MIT"
repository = "https://github.com/larrriiin/zapret-ui"
homepage = "https://github.com/larrriiin/zapret-ui"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zapret_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
reqwest = { version = "0.13", features = ["json", "socks", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
base64 = "0.23"
minisign-verify = "0.2.5"
zip = { version = "8", default-features = false, features = ["deflate", "deflate-flate2", "bzip2"] }
rfd = "0.17"
tokio = { version = "1", features = ["net", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[[bin]]
name = "zapret-ui"
path = "src/main.rs"
